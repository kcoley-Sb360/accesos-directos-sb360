<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico Comercial — SalesBox360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --naranja:#F05A12;
    --grafito:#4D4D4F;
    --gris:#8A8A8D;
    --blanco:#F7F7F5;
    --rojo:#C0392B;
    --ambar:#E8A33D;
    --verde:#3C8F5C;
    --borde:#E1DFDA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--blanco);
    color:var(--grafito);
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Oswald',"Arial Narrow",Arial,sans-serif;
    color:var(--grafito);
    margin:0;
    text-transform:none;
  }
  .app{max-width:980px;margin:0 auto;padding:0 20px 80px;}

  /* NAVBAR */
  .navbar{
    background:#fff;
    border-bottom:1px solid var(--borde);
    position:sticky;top:0;z-index:50;
  }
  .navbar-inner{
    max-width:980px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .navbar-brand{display:flex;align-items:center;gap:14px;}
  .navbar img{height:66px;display:block;}
  .navbar-context{font-family:'Oswald',sans-serif;font-size:13px;color:var(--gris);border-left:1px solid var(--borde);padding-left:14px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Oswald',sans-serif;
    font-size:13px;letter-spacing:.02em;
    padding:10px 14px;border-radius:8px;border:1px solid var(--borde);
    background:#fff;color:var(--grafito);cursor:pointer;
    transition:all .15s ease;
    text-transform:uppercase;font-weight:500;
  }
  .tab-btn:hover{border-color:var(--naranja);}
  .tab-btn.active{
    background:var(--grafito);color:#fff;border-color:var(--grafito);
  }
  .tab-btn.nav-back{background:var(--blanco);}

  /* HERO / TITLE */
  .hero{padding:28px 0 6px;}
  .hero .eyebrow{
    color:var(--naranja);font-family:'Oswald',sans-serif;font-weight:600;
    letter-spacing:.12em;font-size:12px;text-transform:uppercase;margin-bottom:6px;
  }
  .hero h1{font-size:30px;font-weight:700;}
  .hero p.sub{color:var(--gris);font-size:14px;margin-top:6px;}

  .section-block{display:none;}
  .section-block.active{display:block;}

  /* LANDING */
  .landing-hero{padding:30px 0 10px;}
  .landing-hero h2{font-size:24px;font-weight:700;}
  .landing-hero p{color:var(--gris);font-size:14px;margin-top:8px;max-width:560px;}
  .landing-hero .btn-export{margin-top:16px;}
  .empty-state{
    margin-top:24px;border:1px dashed var(--borde);border-radius:12px;padding:40px;
    text-align:center;color:var(--gris);font-size:14px;
  }
  .case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px;}
  .case-card{
    background:#fff;border:1px solid var(--borde);border-radius:12px;padding:18px;
    display:flex;flex-direction:column;gap:8px;
  }
  .case-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .case-card-top h3{font-size:16px;font-weight:600;line-height:1.3;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;opacity:.55;padding:2px;}
  .icon-btn:hover{opacity:1;}
  .case-meta{font-size:12px;color:var(--gris);}
  .case-progress{display:flex;gap:10px;font-size:11.5px;color:var(--grafito);font-weight:600;margin-top:2px;flex-wrap:wrap;}
  .btn-open-case{
    margin-top:10px;background:var(--blanco);border:1px solid var(--borde);border-radius:8px;
    padding:9px 12px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;
    cursor:pointer;text-align:left;color:var(--grafito);
  }
  .btn-open-case:hover{border-color:var(--naranja);color:var(--naranja);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(77,77,79,.55);display:flex;align-items:center;justify-content:center;z-index:200;
  }
  .modal-box{background:#fff;border-radius:12px;padding:24px;max-width:360px;width:90%;}
  .modal-box p{font-size:14px;color:var(--grafito);line-height:1.5;margin:0 0 18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .modal-btn{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:7px;
    border:1px solid var(--borde);background:#fff;cursor:pointer;
  }
  .modal-btn.confirm{background:var(--rojo);border-color:var(--rojo);color:#fff;}
  .modal-btn.cancel:hover{border-color:var(--gris);}

  /* FICHA */
  .card{
    background:#fff;border:1px solid var(--borde);border-radius:12px;
    padding:22px;margin-top:20px;
  }
  .ficha-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;
  }
  @media(max-width:720px){.ficha-grid{grid-template-columns:repeat(2,1fr);}}
  .field label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--gris);font-weight:600;margin-bottom:5px;
  }
  .field input{
    width:100%;border:1px solid var(--borde);border-radius:7px;
    padding:9px 10px;font-family:'Inter',sans-serif;font-size:14px;color:var(--grafito);
    background:var(--blanco);
  }
  .field input:focus{outline:2px solid var(--naranja);outline-offset:1px;}
  .card-title{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);
    text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  }
  .card-title .sq{width:9px;height:9px;background:var(--naranja);display:inline-block;}

  /* CATEGORY CARD */
  .cat-card{background:#fff;border:1px solid var(--borde);border-radius:12px;margin-top:16px;overflow:hidden;}
  .cat-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 20px;border-bottom:1px solid var(--borde);background:var(--blanco);flex-wrap:wrap;
  }
  .cat-head h3{font-size:18px;font-weight:600;}
  .cat-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:20px;color:#fff;min-width:64px;text-align:center;
  }
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}

  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:13px 20px;border-bottom:1px solid #EFEDE8;
  }
  .item-row:last-child{border-bottom:none;}
  .item-text{font-size:14px;line-height:1.4;flex:1;}
  .item-text .idx{color:var(--gris);font-weight:600;margin-right:6px;}
  .unanswered-flag{
    font-size:10px;color:var(--naranja);border:1px solid var(--naranja);
    padding:2px 6px;border-radius:10px;margin-left:8px;text-transform:uppercase;
    letter-spacing:.04em;font-weight:600;white-space:nowrap;
  }

  /* toggle POSITIVO / NEGATIVO / N/A */
  .pos-neg{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;}
  .pn-btn{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;
    padding:8px 12px;border-radius:7px;border:1px solid var(--borde);
    background:#fff;color:var(--gris);cursor:pointer;letter-spacing:.03em;
    transition:all .12s ease;
  }
  .pn-btn.positivo.selected{background:var(--verde);border-color:var(--verde);color:#fff;}
  .pn-btn.negativo.selected{background:var(--rojo);border-color:var(--rojo);color:#fff;}
  .pn-btn.na.selected{background:var(--gris);border-color:var(--gris);color:#fff;}
  .na-flag{
    font-size:10px;color:var(--gris);border:1px solid var(--gris);
    padding:2px 6px;border-radius:10px;margin-left:8px;text-transform:uppercase;
    letter-spacing:.04em;font-weight:600;white-space:nowrap;
  }
  .pn-btn:hover{border-color:var(--naranja);}

  /* scale 1-5 */
  .scale5{display:flex;gap:5px;flex:none;}
  .s5-btn{
    width:34px;height:34px;border-radius:7px;border:1px solid var(--borde);
    background:#fff;color:var(--gris);font-family:'Oswald',sans-serif;font-weight:600;
    cursor:pointer;font-size:13px;transition:all .12s ease;
  }
  .s5-btn:hover{border-color:var(--naranja);}
  .s5-btn.selected{background:var(--naranja);border-color:var(--naranja);color:#fff;}

  /* RESULTS */
  .results-title{margin-top:34px;display:flex;align-items:baseline;gap:10px;}
  .results-title h2{font-size:22px;font-weight:700;}
  .warn-banner{
    margin-top:14px;background:#FDF3E9;border:1px solid var(--ambar);color:#8A5A1A;
    padding:12px 16px;border-radius:9px;font-size:13px;font-weight:500;
  }
  .bars{margin-top:16px;}
  .bar-row{margin-top:14px;}
  .bar-row .bar-label{
    display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;
  }
  .bar-row .bar-label b{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;}
  .bar-track{
    height:12px;background:#EDEBE6;border-radius:20px;overflow:hidden;width:100%;
  }
  .bar-fill{height:100%;border-radius:20px;}
  .bar-fill.incomplete{background:repeating-linear-gradient(45deg,#D7D5D0,#D7D5D0 6px,#E4E2DD 6px,#E4E2DD 12px);}

  .index-hero{
    margin-top:18px;display:flex;align-items:center;gap:22px;
    background:var(--grafito);border-radius:12px;padding:22px 26px;color:#fff;flex-wrap:wrap;
  }
  .index-hero .num{font-family:'Oswald',sans-serif;font-size:44px;font-weight:700;line-height:1;}
  .index-hero .num small{font-size:18px;font-weight:400;opacity:.7;}
  .index-hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#D9D9D9;margin-bottom:4px;}
  .index-hero .semtag{
    margin-left:auto;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;
    padding:7px 14px;border-radius:20px;text-align:center;
  }

  .resumen-box{
    margin-top:20px;background:#FFF3EC;border-left:4px solid var(--naranja);border-radius:0 10px 10px 0;
    padding:14px 18px;font-size:13.5px;color:#5B4433;line-height:1.55;
  }

  .weak-wrap{margin-top:26px;}
  .weak-card{
    border:1px solid var(--borde);border-left:4px solid var(--naranja);
    background:#fff;border-radius:0 10px 10px 0;padding:16px 18px;margin-top:12px;
  }
  .weak-card h4{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .weak-card p{font-size:13.5px;color:#5B5B5D;margin:7px 0 0;line-height:1.5;}
  .weak-card .score-tag{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:#fff;
    padding:3px 9px;border-radius:12px;
  }
  .tipo-badge{
    font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;color:#fff;
    padding:3px 9px;border-radius:12px;text-transform:uppercase;letter-spacing:.03em;
  }
  .hallazgo{font-size:13.5px;color:#3f3f41;line-height:1.55;margin-top:9px;}
  .questions-block{margin-top:12px;}
  .qb-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);font-weight:600;margin-bottom:5px;}
  .q-list{margin:0;padding-left:18px;}
  .q-list li{font-size:13px;color:#3f3f41;margin-top:4px;line-height:1.45;}
  .kpi-block{margin-top:14px;border-top:1px dashed var(--borde);padding-top:12px;}
  .kpi-suggest{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .kpi-suggest-label{font-size:12.5px;color:var(--grafito);}
  .kpi-actions{display:flex;gap:8px;}
  .mini-btn{
    font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;padding:6px 11px;border-radius:16px;
    border:1px solid var(--naranja);background:var(--naranja);color:#fff;cursor:pointer;white-space:nowrap;
  }
  .mini-btn.ghost{background:#fff;color:var(--gris);border-color:var(--borde);}
  .mini-btn:disabled{background:#D7D5D0;border-color:#D7D5D0;color:#8A8A8D;cursor:not-allowed;}
  .kpi-added{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .kpi-added-grid{
    display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end;
    background:var(--blanco);border:1px solid var(--borde);border-radius:9px;padding:12px;margin-top:8px;
  }
  @media(max-width:720px){.kpi-added-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .kpi-field label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);font-weight:600;}
  .kpi-remove-btn{white-space:nowrap;padding-bottom:9px;}
  .kpi-input{
    flex:1;min-width:140px;border:1px solid var(--borde);border-radius:7px;padding:7px 9px;font-size:12.5px;
    font-family:'Inter',sans-serif;background:var(--blanco);
  }
  .kpi-skipped{font-size:12.5px;color:var(--gris);font-style:italic;}
  .link-btn{background:none;border:none;color:var(--naranja);font-size:12px;font-weight:600;cursor:pointer;padding:0;}
  .link-btn.danger{color:var(--rojo);}

  /* THEME / CORRELATION */
  .theme-chips{margin-top:8px;}
  .theme-chip{display:inline-block;font-size:11px;padding:4px 9px;border-radius:12px;margin:3px 4px 0 0;font-weight:600;}
  .theme-chip.weak{background:var(--rojo);color:#fff;}
  .theme-chip.ok{background:var(--verde);color:#fff;}
  .theme-chip.pending{background:#EDEBE6;color:var(--gris);border:1px dashed var(--borde);}
  .theme-chip.off{background:#F2F1EE;color:#B9B7B2;}
  .weak-card.theme-confirmed{border-left-color:var(--rojo);}
  .kpi-summary-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .kpi-summary-row{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#fff;border:1px solid var(--borde);border-radius:9px;padding:10px 12px;}
  .kpi-summary-row .kpi-added-grid{width:100%;background:transparent;border:none;padding:0;margin-top:0;}
  .kpi-summary-tag{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;color:var(--gris);background:var(--blanco);padding:3px 8px;border-radius:10px;white-space:nowrap;}

  /* SNAPSHOT / SÍNTESIS */
  .snapshot-row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;}
  .snapshot-card{flex:1;min-width:160px;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:16px;text-align:center;}
  .snapshot-card.empty{background:var(--blanco);border-style:dashed;}
  .snapshot-label{font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:8px;}
  .snapshot-num{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;}
  .snapshot-tag{display:inline-block;margin-top:6px;font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;color:#fff;padding:3px 10px;border-radius:12px;text-transform:uppercase;}
  .snapshot-empty-text{color:var(--gris);font-size:13px;padding:10px 0;}

  .tipo-dist{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .tipo-dist-row{display:flex;align-items:center;gap:10px;}
  .tipo-dist-label{width:210px;flex:none;font-size:13px;display:flex;align-items:center;gap:7px;}
  .tipo-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .tipo-dist-track{flex:1;height:10px;background:#EDEBE6;border-radius:10px;overflow:hidden;}
  .tipo-dist-fill{height:100%;border-radius:10px;}
  .tipo-dist-count{width:20px;text-align:right;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;}

  .brief-box{margin-top:14px;}
  .brief-textarea{
    width:100%;min-height:220px;border:1px solid var(--borde);border-radius:10px;padding:16px;
    font-family:'Inter',monospace;font-size:12.5px;line-height:1.6;color:var(--grafito);
    background:#fff;resize:vertical;white-space:pre-wrap;box-sizing:border-box;
  }
  .brief-box .mini-btn{margin-top:10px;}

  /* SECTION 3 items */
  .s3-row{
    display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid #EFEDE8;
  }
  .s3-row:last-child{border-bottom:none;}
  .s3-row.disabled{opacity:.45;}
  .switch{position:relative;width:40px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider-track{
    position:absolute;inset:0;background:#D7D5D0;border-radius:20px;cursor:pointer;transition:.15s;
  }
  .switch .slider-track:before{
    content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.15s;
  }
  .switch input:checked + .slider-track{background:var(--naranja);}
  .switch input:checked + .slider-track:before{transform:translateX(18px);}

  .s3-name-input{
    border:1px solid transparent;background:transparent;font-size:14.5px;font-weight:600;
    color:var(--grafito);font-family:'Inter',sans-serif;padding:6px 8px;border-radius:6px;
    width:220px;flex:none;
  }
  .s3-name-input:hover{border-color:var(--borde);}
  .s3-name-input:focus{outline:none;border-color:var(--naranja);background:#fff;}

  .s3-slider-wrap{flex:1;display:flex;align-items:center;gap:12px;position:relative;}
  .s3-slider-wrap input[type=range]{
    flex:1;-webkit-appearance:none;height:6px;border-radius:6px;background:#EDEBE6;outline:none;
  }
  .s3-slider-wrap input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--naranja);
    border:3px solid #fff;box-shadow:0 0 0 1px var(--naranja);cursor:pointer;
  }
  .s3-slider-wrap.unanswered input[type=range]::-webkit-slider-thumb{
    background:#BEBCB7;box-shadow:0 0 0 1px #BEBCB7;
  }
  .s3-slider-wrap input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--naranja);border:3px solid #fff;
    box-shadow:0 0 0 1px var(--naranja);cursor:pointer;
  }
  .s3-badge{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;width:30px;text-align:center;
    color:var(--grafito);flex:none;
  }
  .s3-hint{font-size:10.5px;color:var(--naranja);text-transform:uppercase;letter-spacing:.03em;
    position:absolute;right:38px;top:-15px;font-weight:600;}

  /* EXPORT BUTTON */
  .export-bar{
    margin-top:34px;display:flex;justify-content:flex-end;
  }
  .capturing .export-bar{display:none;}
  .capturing .kpi-actions{display:none;}
  .capturing .link-btn{display:none;}
  .capturing .mini-btn{display:none;}
  .capturing .kpi-suggest{display:none;}
  #capture-section3.capturing .s3-row.disabled,
  #capture-section3.capturing .s3-row.not-answered,
  #capture-section3.capturing .bar-row.not-answered,
  #capture-section3.capturing .warn-banner{
    display:none;
  }
  #capture-section2.capturing .cat-card.locked{display:none;}
  #capture-section1.capturing .cat-card.locked{display:none;}

  .lock-btn{
    font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.03em;
    padding:6px 11px;border-radius:20px;border:1px solid var(--borde);background:#fff;
    color:var(--gris);cursor:pointer;text-transform:uppercase;white-space:nowrap;
    display:flex;align-items:center;gap:5px;
  }
  .lock-btn:hover{border-color:var(--naranja);color:var(--naranja);}
  .lock-btn.is-locked{background:var(--grafito);border-color:var(--grafito);color:#fff;}
  .cat-card.locked{background:#FAFAF8;}
  .cat-card.locked .item-row{opacity:.4;pointer-events:none;}
  .locked-banner{
    padding:10px 20px;background:#F2F1EE;color:var(--gris);font-size:12.5px;
    border-top:1px solid var(--borde);font-style:italic;
  }

  /* GUÍA DE ARRANQUE */
  .intake-options{padding:16px 20px;display:flex;flex-direction:column;gap:8px;}
  .intake-opt{
    text-align:left;border:1px solid var(--borde);border-radius:9px;padding:12px 14px;
    background:#fff;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--grafito);cursor:pointer;
    transition:all .12s ease;
  }
  .intake-opt:hover{border-color:var(--naranja);}
  .intake-opt.selected{border-color:var(--naranja);background:#FFF3EC;font-weight:600;}

  .btn-export{
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;font-size:13px;
    background:var(--naranja);color:#fff;border:none;border-radius:8px;
    padding:13px 22px;cursor:pointer;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .btn-export:hover{background:#D64F0E;}
  .btn-export:disabled{background:var(--gris);cursor:not-allowed;}

  .legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
  .legend span{font-size:12px;color:var(--gris);display:flex;align-items:center;gap:6px;}
  .legend .dot{width:9px;height:9px;}

  .footer-note{text-align:center;color:var(--gris);font-size:11.5px;margin-top:40px;}

  /* PDF export container helper */
  .pdf-header-logo{display:none;}
  .capturing .pdf-header-logo{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .capturing .pdf-header-logo img{height:52px;}
  .capturing .pdf-header-logo span{
    font-family:'Oswald',sans-serif;font-weight:600;color:var(--gris);font-size:12px;
    text-transform:uppercase;letter-spacing:.08em;
  }
</style>
</head>

function computeIntakeRecommendation(){
  const answers = state.intake.answers;
  if(answers.some(a=>a===null)) return null;
  const totals = {1:0,2:0,3:0};
  answers.forEach((optIdx, qi)=>{
    const opt = INTAKE_QUESTIONS[qi].options[optIdx];
    Object.entries(opt.weights).forEach(([sec,w])=>{ totals[sec]+=w; });
  });
  const max = Math.max(totals[1], totals[2], totals[3]);
  const top = [1,2,3].filter(s=>totals[s]===max);
  return { totals, top };
}
function renderIntake(){
  let html = renderFicha();
  html += `<div class="card" style="margin-top:20px;">
    <div class="card-title"><span class="sq"></span>Guía de arranque</div>
    <p style="font-size:13.5px;color:#5B5B5D;margin-top:10px;line-height:1.5;">Responde estas 5 preguntas junto con el cliente antes de elegir qué modalidad del diagnóstico aplicar. Son obligatorias — al completarlas verás la recomendación.</p>
  </div>`;

  INTAKE_QUESTIONS.forEach((q, qi)=>{
    const selected = state.intake.answers[qi];
    html += `<div class="cat-card">
      <div class="cat-head"><h3>${qi+1}. ${esc(q.text)}</h3></div>
      <div class="intake-options">
        ${q.options.map((opt,oi)=>`<button class="intake-opt ${selected===oi?'selected':''}" data-intake-q="${qi}" data-intake-o="${oi}">${esc(opt.label)}</button>`).join("")}
      </div>
    </div>`;
  });

  const answeredCount = state.intake.answers.filter(a=>a!==null).length;
  const rec = computeIntakeRecommendation();
  html += `<div class="results-title"><h2>Recomendación</h2></div>`;
  if(!rec){
    html += `<div class="warn-banner">⚠ Responde las 5 preguntas (van ${answeredCount}/5) para ver qué modalidad conviene aplicar con este cliente.</div>`;
  } else {
    html += `<div class="index-hero">
      <div>
        <div class="label">Modalidad${rec.top.length>1?'es':''} recomendada${rec.top.length>1?'s':''}</div>
        <div class="num" style="font-size:22px;">${rec.top.map(s=>esc(SECTION_META[s].name)).join(' + ')}</div>
      </div>
    </div>`;
    html += `<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
      ${rec.top.map(s=>`<button class="mini-btn" data-goto-tab="${SECTION_META[s].tab}" type="button">Ir a ${esc(SECTION_META[s].name)} →</button>`).join("")}
    </div>
    <p style="color:var(--gris);font-size:13px;margin-top:14px;">Esta es una guía inicial, no una restricción — puedes explorar cualquier otra modalidad si lo consideras útil con este cliente.</p>`;
  }
  return html;
}
function bindIntake(root){

}

const HALLAZGO_AREA = [
  (n,p)=>`"${n}" no está funcionando como práctica consistente hoy: apenas el ${p}% de lo esperado está en marcha.`,
  (n,p)=>`En "${n}" hay más intención que ejecución real — el ${p}% indica que falta consolidar esto como hábito del equipo.`,
  (n,p)=>`"${n}" es una de las áreas con mayor brecha (${p}%). Esto suele traducirse en resultados inconsistentes mes a mes.`
];
const HALLAZGO_IND = [
  (n,p)=>`En "${n}" el desempeño está por debajo de lo esperado (${p}%) — vale la pena entender si es un tema de conocimiento, de disciplina o de falta de herramientas.`,
  (n,p)=>`"${n}" aparece como un punto a reforzar (${p}%): antes de asumir la causa, esto se debe validar directamente con el vendedor.`,
  (n,p)=>`El puntaje de "${n}" (${p}%) sugiere una oportunidad clara de desarrollo en esta competencia específica.`
];
function hallazgoText(name, pct, individual, seed){
  const bank = individual ? HALLAZGO_IND : HALLAZGO_AREA;
  return bank[seed % bank.length](name, pct);
}
function buildResumen(idx, weakNames, scopeLabel, entity){
  if((idx===null || idx===undefined) && weakNames.length===0) return null;
  const withWhom = entity==='el vendedor' ? 'el vendedor evaluado' : 'el cliente';
  if(weakNames.length===0){
    return `El panorama en ${scopeLabel} luce sólido${idx!==null?` (${idx}%)`:''}. Vale la pena confirmar con ${withWhom} qué está funcionando bien, más que buscar una intervención correctiva aquí.`;
  }
  const names = weakNames.map(n=>`"${n}"`);
  const joined = names.length===1 ? names[0] : names.slice(0,-1).join(", ")+" y "+names[names.length-1];
  return `El panorama general en ${scopeLabel}${idx!==null?` está en ${idx}%`:''}, con una brecha clara en ${joined} — son las áreas para profundizar hoy mismo con ${withWhom}.`;
}
function esc(s){ return (s||"").toString().replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }

const CASES_KEY = 'sb360_diagnostico_casos_v1';
function loadCases(){
  try{ return JSON.parse(localStorage.getItem(CASES_KEY)) || {}; }catch(e){ return {}; }
}
function persistCase(){
  if(!state) return;
  state.updatedAt = Date.now();
  const all = loadCases();
  all[state.id] = state;
  try{ localStorage.setItem(CASES_KEY, JSON.stringify(all)); }catch(e){ console.error('No se pudo guardar', e); }
}

  };
}

/* ============== APP STATE ============== */
let appView = 'landing';
let state = null;

/* ============== HELPERS DE SCORING ============== */
function semColor(pct){
  if(pct === null) return "#BEBCB7";
  if(pct < 40) return "var(--rojo)";
  if(pct < 70) return "var(--ambar)";
  return "var(--verde)";
}
function semLabel(pct){
  if(pct === null) return "Incompleto";
  if(pct < 40) return "Deficiente";
  if(pct < 70) return "Regular";
  return "Positivo";
}
function catPercentS1(cat){
  if(cat.items.some(v=>v===null)) return null;
  const scored = cat.items.filter(v=>v!=='na');
  if(scored.length===0) return null;
  const pos = scored.filter(v=>v===true).length;
  return Math.round((pos/scored.length)*100);
}
function catPercentS2(cat){
  const answered = cat.items.filter(v=>v!==null);
  if(answered.length < cat.items.length) return null;
  const sum = answered.reduce((a,b)=>a+b,0);
  return Math.round((sum/(answered.length*5))*100);
}
function overallIndex(cats, fn){
  const pcts = cats.map(fn);
  if(pcts.some(p=>p===null)) return null;
  return Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
}
function withIdx(arr){ return arr.map((c,i)=>({ ...c, origIdx:i })); }
function weakest(cats, fn, n){
  return cats.map(c=>({cat:c, pct:fn(c)}))
    .filter(x=>x.pct!==null)
    .sort((a,b)=>a.pct-b.pct)
    .slice(0,n);
}

/* ============== MODAL DE CONFIRMACIÓN ============== */
function showConfirmModal(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <p>${esc(message)}</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modal-cancel">Cancelar</button>
      <button class="modal-btn confirm" id="modal-confirm">Eliminar</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#modal-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#modal-confirm').onclick = ()=>{ overlay.remove(); onConfirm(); };
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
}

/* ============== RENDER: NAV ============== */
function renderNav(){
  const tabsEl = document.getElementById('tabs');
  const ctx = document.getElementById('navbar-context');
  ctx.textContent = (appView==='case' && state && state.header.empresa) ? state.header.empresa : '';

  if(appView==='landing'){
    tabsEl.innerHTML = '';
    return;
  }
  const tabs = [
    {id:0,label:"Guía de arranque"},
    {id:1,label:"Diagnóstico del departamento comercial"},
    {id:2,label:"Diagnóstico de la gestión comercial"},
    {id:3,label:"Diagnóstico de competencias comerciales"},
    {id:4,label:"Panel 360° · Conclusiones"}
  ];
  tabsEl.innerHTML = `<button class="tab-btn nav-back" id="btn-back-landing">← Mis diagnósticos</button>` +
    tabs.map(t=>`<button class="tab-btn ${state.currentTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  document.getElementById('btn-back-landing').onclick = ()=>{ appView='landing'; renderAll(); };
  tabsEl.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ state.currentTab = parseInt(b.dataset.tab); renderAll(); };
  });
}

/* ============== RENDER: LANDING ============== */
function renderLandingView(){
  const cases = Object.values(loadCases()).sort((a,b)=>b.updatedAt-a.updatedAt);
  let html = `<div class="landing-hero">
    <h2>Tus diagnósticos guardados</h2>
    <p>Cada diagnóstico se guarda automáticamente en este navegador, identificado por empresa. Ábrelo para continuar donde lo dejaste o crea uno nuevo para un cliente distinto.</p>
    <button class="btn-export" id="btn-new-case">+ Nuevo diagnóstico</button>
  </div>`;

  if(cases.length===0){
    html += `<div class="empty-state">Aún no tienes diagnósticos guardados. Crea el primero con el botón de arriba.</div>`;
  } else {
    html += `<div class="case-grid">`;
    cases.forEach(c=>{
      const s1visible = c.s1.filter(cat=>!cat.locked);
      const s1p = s1visible.filter(cat=>cat.items.every(v=>v!==null)).length;
      const s2visible = c.s2.filter(cat=>!cat.locked);
      const s2p = s2visible.filter(cat=>cat.items.every(v=>v!==null)).length;
      const s3enabled = c.s3.filter(i=>i.enabled);
      const s3p = s3enabled.length ? `${s3enabled.filter(i=>i.answered).length}/${s3enabled.length}` : "—";
      html += `<div class="case-card">
        <div class="case-card-top">
          <h3>${esc(c.header.empresa) || "Sin nombre de empresa"}</h3>
          <button class="icon-btn danger" data-delete-case data-id="${c.id}" title="Eliminar">🗑</button>
        </div>
        <div class="case-meta">${esc(c.header.evaluador)||"Sin evaluador"} · ${c.header.fecha||""}</div>
        <div class="case-progress">
          <span>Sección 1: ${s1p}/${s1visible.length}</span><span>Sección 2: ${s2p}/${s2visible.length}</span><span>Sección 3: ${s3p}</span>
        </div>
        <button class="btn-open-case" data-open-case data-id="${c.id}">Abrir diagnóstico →</button>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}
function bindLanding(root){
  const btn = document.getElementById('btn-new-case');
  if(btn) btn.onclick = ()=>{
    state = newState();
    persistCase();
    appView = 'case';
    renderAll();
  };
  root.querySelectorAll('[data-open-case]').forEach(b=>{
    b.onclick = ()=>{
      const all = loadCases();
      state = all[b.dataset.id];
      if(!state.kpis) state.kpis = [];
      state.kpis.forEach(k=>{ if(k.meta===undefined) k.meta=""; if(k.tiempo===undefined) k.tiempo=""; });
      if(!state.intake) state.intake = { answers:[null,null,null,null,null] };
      appView = 'case';
      renderAll();
    };
  });
  root.querySelectorAll('[data-delete-case]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.id;
      const all = loadCases();
      const empresa = (all[id] && all[id].header.empresa) || "este diagnóstico";
      showConfirmModal(`¿Eliminar el diagnóstico de "${empresa}"? Esta acción no se puede deshacer.`, ()=>{
        delete all[id];
        try{ localStorage.setItem(CASES_KEY, JSON.stringify(all)); }catch(e){}
        renderAll();
      });
    };
  });
}

function bindFicha(root){
  root.querySelectorAll('[data-field]').forEach(inp=>{
    inp.oninput = ()=>{
      state.header[inp.dataset.field] = inp.value;
      syncFieldAcrossDom(`[data-field="${inp.dataset.field}"]`, inp.value, inp);
      persistCase();
    };
  });
}
function syncFieldAcrossDom(selector, value, origin){
  document.querySelectorAll(selector).forEach(inp=>{ if(inp!==origin && document.activeElement!==inp) inp.value = value; });
}

/* ============== BLOQUE DE CONCLUSIÓN (weak card) ============== */
function kpiEditRow(entry){
  return `<div class="kpi-added kpi-added-grid">
    <div class="kpi-field"><label>Nombre del KPI</label><input type="text" class="kpi-input" value="${escAttr(entry.label)}" data-kpi-label data-id="${entry.id}" placeholder="Ej. Tasa de cierre"></div>
    <div class="kpi-field"><label>Actual</label><input type="text" class="kpi-input" value="${escAttr(entry.value)}" data-kpi-value data-id="${entry.id}" placeholder="Dato vigente"></div>
    <div class="kpi-field"><label>Meta</label><input type="text" class="kpi-input" value="${escAttr(entry.meta||'')}" data-kpi-meta data-id="${entry.id}" placeholder="Lo deseable"></div>
    <div class="kpi-field"><label>Tiempo</label><input type="text" class="kpi-input" value="${escAttr(entry.tiempo||'')}" data-kpi-tiempo data-id="${entry.id}" placeholder="Ej. 6 meses"></div>
    <button class="link-btn danger kpi-remove-btn" data-kpi-remove data-id="${entry.id}">Quitar KPI</button>
  </div>`;
}
function weakCard(d){
  const areaKpis = state.kpis.filter(k=>k.areaKey===d.areaKey);
  const addedSuggestionIdxs = new Set(areaKpis.filter(k=>k.suggestionIdx!==null && k.suggestionIdx!==undefined).map(k=>k.suggestionIdx));
  const customKpis = areaKpis.filter(k=>k.suggestionIdx===null || k.suggestionIdx===undefined);

  const suggestionsHtml = d.insight.kpis.slice(0,3).map((kpiText,i)=>{
    if(addedSuggestionIdxs.has(i)){
      const entry = areaKpis.find(k=>k.suggestionIdx===i);
      return kpiEditRow(entry);
    }
    return `<div class="kpi-suggest">
      <span class="kpi-suggest-label">${esc(kpiText)}</span>
      <button class="mini-btn" data-kpi-add data-key="${d.areaKey}" data-section="${d.sectionNum}" data-label="${escAttr(kpiText)}" data-sugidx="${i}">+ Usar</button>
    </div>`;
  }).join("");

  const customHtml = customKpis.map(k=>kpiEditRow(k)).join("");

  return `<div class="weak-card">
    <h4>${esc(d.name)} <span class="score-tag" style="background:${semColor(d.pct)}">${d.pct}%</span> <span class="tipo-badge" style="background:${TIPO_COLORS[d.insight.tipo]}">${esc(d.insight.tipo)}</span></h4>
    <p class="hallazgo">${hallazgoText(d.name, d.pct, d.individual, d.seed)}</p>
    <div class="questions-block">
      <div class="qb-label">Preguntas para profundizar en vivo</div>
      <ul class="q-list">${d.insight.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
    </div>
    <div class="kpi-block">
      <div class="qb-label">KPIs sugeridos (hasta 3 por conclusión)</div>
      ${suggestionsHtml}
      ${customHtml}
      <button class="mini-btn ghost" data-kpi-custom-add data-key="${d.areaKey}" data-section="${d.sectionNum}">+ Crear KPI personalizado</button>
    </div>
  </div>`;
}

/* ============== RENDER: SECTION 1 ============== */
function renderSection1(){
  let html = renderFicha();
  html += `<div class="legend">
    <span><span class="dot" style="background:var(--verde)"></span>Positivo (≥70%)</span>

    html += `<div class="cat-card ${cat.locked?'locked':''}">
      <div class="cat-head">
        <h3>${esc(cat.name)}</h3>
        <div class="cat-meta">
          ${(missing>0 && !cat.locked)?`<span class="unanswered-flag">${missing} sin responder</span>`:""}

          <span class="pill" style="background:${cat.locked?'#BEBCB7':(pct===null?'var(--gris)':semColor(pct))}">${cat.locked?"—":(pct===null?"—":pct+"%")}</span>
        </div>
      </div>
      ${cat.items.map((val,ii)=>`
        <div class="item-row">
          <div class="item-text"><span class="idx">${ii+1}.</span>${esc(SECTION1_DATA[ci].items[ii])}${(val===null && !cat.locked)?'<span class="unanswered-flag">Sin responder</span>':''}${val==='na'?'<span class="na-flag">No aplica</span>':''}</div>
          <div class="pos-neg">

}

/* ============== RENDER: RESULTS (compartido s1/s2) ============== */
function renderResultsBlock(cats, fn, scopeLabel, sectionNum, insightsArr, entity){
  const idx = overallIndex(cats, fn);
  const anyIncomplete = cats.some(c=>fn(c)===null);
  const weak = weakest(cats, fn, 3).filter(w=>w.pct<70);

  let html = `<div class="results-title"><h2>Resultados</h2></div>`;
  if(anyIncomplete){
    html += `<div class="warn-banner">⚠ Hay categorías incompletas. El índice general y las conclusiones se calculan solo con las categorías 100% respondidas.</div>`;
  }
  html += `<div class="index-hero">
    <div>
      <div class="label">Índice general — Diagnóstico de ${esc(scopeLabel)}</div>
      <div class="num">${idx===null?"—":idx}${idx!==null?'<small>/100</small>':''}</div>
    </div>
    <div class="semtag" style="background:${idx===null?'#6b6b6d':semColor(idx)};color:#fff;">${semLabel(idx)}</div>
  </div>`;

  html += `<div class="bars">`;
  const sortedCats = [...cats].sort((a,b)=>{
    const pa = fn(a), pb = fn(b);
    if(pa===null && pb===null) return 0;
    if(pa===null) return 1;
    if(pb===null) return -1;
    return pa - pb;
  });
  sortedCats.forEach(c=>{
    const p = fn(c);
    html += `<div class="bar-row">
      <div class="bar-label"><span>${esc(c.name)}</span><b>${p===null?"Incompleto":p+"%"}</b></div>
      <div class="bar-track"><div class="bar-fill ${p===null?'incomplete':''}" style="width:${p===null?100:p}%;background:${p===null?'':semColor(p)}"></div></div>
    </div>`;
  });
  html += `</div>`;

  const resumen = buildResumen(idx, weak.map(w=>w.cat.name), scopeLabel, entity);
  if(resumen){
    html += `<div class="resumen-box"><b>Lectura rápida:</b> ${esc(resumen)}</div>`;
  }

  if(weak.length>0){
    html += `<div class="weak-wrap"><h3 style="font-size:16px;font-weight:600;">Conclusiones para profundizar en vivo</h3>`;
    weak.forEach(w=>{
      const insight = insightsArr[w.cat.origIdx];
      const areaKey = `s${sectionNum}-${w.cat.origIdx}`;
      html += weakCard({ name:w.cat.name, pct:w.pct, insight, areaKey, sectionNum, seed:w.cat.origIdx, individual:false });
    });
    html += `</div>`;
  } else if(!anyIncomplete && idx!==null){
    html += `<div class="weak-wrap"><h3 style="font-size:16px;font-weight:600;">Conclusiones para profundizar en vivo</h3><p style="color:var(--gris);font-size:13.5px;margin-top:8px;">No se identifican categorías por debajo del umbral de atención (70%). El desempeño general es sólido.</p></div>`;
  }

  return html;
}

/* ============== RENDER: SECTION 3 ============== */
function renderSection3(){
  let html = renderFicha();
  html += `<div class="cat-card">
    <div class="cat-head">
      <h3>Competencias comerciales evaluadas</h3>
      <span style="font-size:12px;color:var(--gris);">Activa/desactiva y renombra según el tipo de gestión a evaluar</span>
    </div>`;

  state.s3.forEach((it, ii)=>{
    html += `<div class="s3-row ${it.enabled?'':'disabled'} ${it.enabled && !it.answered?'not-answered':''}">
      <label class="switch">
        <input type="checkbox" ${it.enabled?'checked':''} data-s3-toggle data-ii="${ii}">
        <span class="slider-track"></span>
      </label>
      <input type="text" class="s3-name-input" value="${escAttr(it.name)}" data-s3-name data-ii="${ii}" ${it.enabled?'':'disabled'}>
      <div class="s3-slider-wrap ${it.answered?'':'unanswered'}">
        ${!it.answered?'<span class="s3-hint">Desliza para evaluar</span>':''}
        <input type="range" min="1" max="10" step="1" value="${it.score||5}" data-s3-slider data-ii="${ii}" ${it.enabled?'':'disabled'}>
        <span class="s3-badge">${it.answered?it.score:"—"}</span>
      </div>
    </div>`;
  });
  html += `</div>`;

  html += renderResultsSection3();
  html += `<div class="export-bar"><button class="btn-export" id="export-3">⭳ Descargar PDF — Sección 3</button></div>`;
  return html;
}

function renderResultsSection3(){
  const s3WithIdx = state.s3.map((it,i)=>({ ...it, origIdx:i }));
  const enabled = s3WithIdx.filter(i=>i.enabled);
  const evaluated = enabled.filter(i=>i.answered);
  const missing = enabled.length - evaluated.length;
  const complete = enabled.length>0 && missing===0;
  const avg = evaluated.length>0 ? Math.round((evaluated.reduce((a,b)=>a+b.score,0)/evaluated.length/10)*100) : null;

  let html = `<div class="results-title"><h2>Resultados</h2></div>`;
  if(!complete){
    html += `<div class="warn-banner">⚠ ${enabled.length===0?"No hay competencias activas para evaluar.":`Faltan ${missing} competencia(s) activa(s) por evaluar. El índice general y las conclusiones consideran únicamente lo ya evaluado.`}</div>`;
  }
  html += `<div class="index-hero">
    <div>
      <div class="label">Índice general de competencias</div>
      <div class="num">${avg===null?"—":avg}${avg!==null?'<small>/100</small>':''}</div>
    </div>
    <div class="semtag" style="background:${avg===null?'#6b6b6d':semColor(avg)};color:#fff;">${semLabel(avg)}</div>
  </div>`;

  html += `<div class="bars">`;
  const sortedEnabled = [...enabled].sort((a,b)=>{
    if(!a.answered && !b.answered) return 0;
    if(!a.answered) return 1;
    if(!b.answered) return -1;
    return a.score - b.score;
  });
  sortedEnabled.forEach(it=>{
    const p = it.answered ? Math.round((it.score/10)*100) : null;
    html += `<div class="bar-row ${it.answered?'':'not-answered'}">
      <div class="bar-label"><span>${esc(it.name)}</span><b>${it.answered?it.score+"/10":"Sin evaluar"}</b></div>
      <div class="bar-track"><div class="bar-fill ${p===null?'incomplete':''}" style="width:${p===null?100:p}%;background:${p===null?'':semColor(p)}"></div></div>
    </div>`;
  });
  html += `</div>`;

  const weakItems = evaluated.map(it=>({name:it.name, score:it.score, origIdx:it.origIdx}))
    .sort((a,b)=>a.score-b.score).slice(0,3).filter(w=>w.score<=7);

  const resumen = buildResumen(avg, weakItems.map(w=>w.name), "las competencias comerciales evaluadas", "el vendedor");
  if(resumen){
    html += `<div class="resumen-box"><b>Lectura rápida:</b> ${esc(resumen)}</div>`;
  }

  if(weakItems.length>0){
    html += `<div class="weak-wrap"><h3 style="font-size:16px;font-weight:600;">Conclusiones para profundizar en vivo</h3>`;
    weakItems.forEach(w=>{
      const pct = Math.round((w.score/10)*100);
      const insight = S3_INSIGHTS[w.origIdx];
      const areaKey = `s3-${w.origIdx}`;
      html += weakCard({ name:w.name, pct, insight, areaKey, sectionNum:3, seed:w.origIdx, individual:true });
    });
    html += `</div>`;
  } else if(evaluated.length>0){
    html += `<div class="weak-wrap"><h3 style="font-size:16px;font-weight:600;">Conclusiones para profundizar en vivo</h3><p style="color:var(--gris);font-size:13.5px;margin-top:8px;">No se identifican competencias por debajo del umbral de atención entre lo evaluado hasta ahora.</p></div>`;
  }
  return html;
}

/* ============== RENDER: SECTION 4 — PANEL 360° ============== */
function buildCorrelation(){
  const results = THEME_GROUPS.map(t=>{
    const sources = [];
    if(t.s1!==undefined){
      const cat = state.s1[t.s1];
      if(cat.locked){
        sources.push({ label:`Sección 1 · ${cat.name}`, status:'off', pct:null });
      } else {
        const pct = catPercentS1(cat);
        sources.push({ label:`Sección 1 · ${cat.name}`, status: pct===null?'pending':(pct<70?'weak':'ok'), pct });
      }
    }
    if(t.s2!==undefined){
      const cat = state.s2[t.s2];
      if(cat.locked){
        sources.push({ label:`Sección 2 · ${cat.name}`, status:'off', pct:null });
      } else {
        const pct = catPercentS2(cat);
        sources.push({ label:`Sección 2 · ${cat.name}`, status: pct===null?'pending':(pct<70?'weak':'ok'), pct });
      }
    }
    if(t.s3!==undefined){
      t.s3.forEach(idx=>{
        const it = state.s3[idx];
        if(!it.enabled){
          sources.push({ label:`Sección 3 · ${it.name}`, status:'off', pct:null });
        } else if(!it.answered){
          sources.push({ label:`Sección 3 · ${it.name}`, status:'pending', pct:null });
        } else {
          const pct = Math.round((it.score/10)*100);
          sources.push({ label:`Sección 3 · ${it.name}`, status: pct<70?'weak':'ok', pct });
        }
      });
    }
    const weakCount = sources.filter(s=>s.status==='weak').length;
    return { name:t.name, sources, weakCount };
  }).filter(t=>t.weakCount>0);

  const confirmed = results.filter(t=>t.weakCount>=2).map(t=>({ ...t,
    note:"Esta brecha aparece en más de una fuente para este cliente — no parece un caso aislado, sino un patrón. Esto fortalece el argumento de una intervención más profunda, no solo un ajuste puntual." }));
  const single = results.filter(t=>t.weakCount===1).map(t=>({ ...t,
    note:"Por ahora esta señal solo aparece en una fuente. Si se aplica otra modalidad con este cliente, se podrá confirmar si es un patrón más amplio o algo puntual." }));
  return { confirmed, single };
}
function chipLabel(s){
  if(s.status==='weak' || s.status==='ok') return `${s.label} · ${s.pct}%`;
  if(s.status==='pending') return `${s.label} · pendiente`;
  return `${s.label} · no aplica`;
}
function themeCard(t, confirmed){
  const chips = t.sources.map(s=>`<span class="theme-chip ${s.status}">${esc(chipLabel(s))}</span>`).join("");
  return `<div class="weak-card ${confirmed?'theme-confirmed':''}">
    <h4>${esc(t.name)}</h4>
    <div class="theme-chips">${chips}</div>
    <p>${t.note}</p>
  </div>`;
}
/* ============== SÍNTESIS PARA LA PROPUESTA ============== */
function collectAllWeakAreas(){
  const items = [];
  withIdx(state.s1).filter(c=>!c.locked).forEach(c=>{
    const pct = catPercentS1(c);
    if(pct!==null && pct<70) items.push({ section:1, name:c.name, pct, tipo:S1_INSIGHTS[c.origIdx].tipo });
  });
  withIdx(state.s2).filter(c=>!c.locked).forEach(c=>{
    const pct = catPercentS2(c);
    if(pct!==null && pct<70) items.push({ section:2, name:c.name, pct, tipo:S2_INSIGHTS[c.origIdx].tipo });
  });
  state.s3.forEach((it,i)=>{
    if(it.enabled && it.answered){
      const pct = Math.round((it.score/10)*100);
      if(pct<70) items.push({ section:3, name:it.name, pct, tipo:S3_INSIGHTS[i].tipo });
    }
  });
  return items.sort((a,b)=>a.pct-b.pct);
}
function sectionSnapshot(){
  const s1cats = withIdx(state.s1).filter(c=>!c.locked);
  const s2cats = withIdx(state.s2).filter(c=>!c.locked);
  const s3enabled = state.s3.filter(i=>i.enabled);
  const s3evaluated = s3enabled.filter(i=>i.answered);
  const s3Idx = s3evaluated.length>0 ? Math.round((s3evaluated.reduce((a,b)=>a+b.score,0)/s3evaluated.length/10)*100) : null;
  return [
    { label:"Departamento comercial", started:s1cats.some(c=>c.items.some(v=>v!==null)), idx:overallIndex(s1cats, catPercentS1) },
    { label:"Gestión comercial", started:s2cats.some(c=>c.items.some(v=>v!==null)), idx:overallIndex(s2cats, catPercentS2) },
    { label:"Competencias comerciales", started:s3enabled.some(i=>i.answered), idx:s3Idx }
  ];
}
function snapshotRow(){
  return `<div class="snapshot-row">` + sectionSnapshot().map(s=>{
    if(!s.started) return `<div class="snapshot-card empty"><div class="snapshot-label">${esc(s.label)}</div><div class="snapshot-empty-text">Sin iniciar</div></div>`;
    return `<div class="snapshot-card">
      <div class="snapshot-label">${esc(s.label)}</div>
      <div class="snapshot-num" style="color:${s.idx===null?'#6b6b6d':semColor(s.idx)}">${s.idx===null?"—":s.idx+"%"}</div>
      <div class="snapshot-tag" style="background:${s.idx===null?'#6b6b6d':semColor(s.idx)}">${semLabel(s.idx)}</div>
    </div>`;
  }).join("") + `</div>`;
}
function tipoDistributionBlock(weakAreas){
  if(weakAreas.length===0) return "";
  const counts = {};
  weakAreas.forEach(w=>{ counts[w.tipo] = (counts[w.tipo]||0)+1; });
  const dist = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = dist[0][1];
  let html = `<div class="results-title" style="margin-top:34px;"><h2>¿Dónde debería enfocarse la propuesta?</h2></div>
  <p style="color:var(--gris);font-size:13px;margin-top:4px;">Distribución de las brechas encontradas hasta ahora, por tipo de intervención.</p>
  <div class="tipo-dist">`;
  dist.forEach(([tipo,count])=>{
    const pct = Math.round((count/max)*100);
    html += `<div class="tipo-dist-row">
      <span class="tipo-dist-label"><span class="tipo-dot" style="background:${TIPO_COLORS[tipo]}"></span>${esc(tipo)}</span>
      <div class="tipo-dist-track"><div class="tipo-dist-fill" style="width:${pct}%;background:${TIPO_COLORS[tipo]}"></div></div>
      <span class="tipo-dist-count">${count}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function buildBrief(weakAreas){
  const snap = sectionSnapshot().filter(s=>s.started && s.idx!==null);
  if(weakAreas.length===0 && snap.length===0 && state.kpis.length===0) return null;
  const empresa = state.header.empresa || "el cliente evaluado";
  let text = `Diagnóstico comercial — ${empresa}\n\n`;
  if(snap.length>0){
    text += `Estado general: ` + snap.map(s=>`${s.label} ${s.idx}%`).join(" · ") + `.\n\n`;
  }
  if(weakAreas.length>0){
    text += `Principales brechas identificadas:\n`;
    weakAreas.slice(0,6).forEach(w=>{ text += `- ${w.name} (${w.pct}%) — ${w.tipo}\n`; });
    text += `\n`;
  }
  if(state.kpis.length>0){
    text += `KPIs a monitorear:\n`;
    state.kpis.forEach(k=>{
      const parts = [];
      if(k.value) parts.push(`Actual: ${k.value}`);
      if(k.meta) parts.push(`Meta: ${k.meta}`);
      if(k.tiempo) parts.push(`Plazo: ${k.tiempo}`);
      text += `- ${k.label || "(sin definir)"}${parts.length?` — ${parts.join(" · ")}`:''}\n`;
    });
  }
  return text.trim();
}

function renderSection4(){
  const s1Any = state.s1.filter(c=>!c.locked).some(c=>c.items.some(v=>v!==null));
  const s2Any = state.s2.filter(c=>!c.locked).some(c=>c.items.some(v=>v!==null));
  const s3Any = state.s3.some(i=>i.enabled && i.answered);
  const sectionsUsed = [s1Any, s2Any, s3Any].filter(Boolean).length;
  const weakAreas = collectAllWeakAreas();

  let html = renderFicha();
  html += `<div class="card" style="margin-top:20px;">
    <div class="card-title"><span class="sq"></span>Panel 360° — Síntesis para la propuesta</div>
    <p style="font-size:13.5px;color:#5B5B5D;margin-top:10px;line-height:1.5;">Consolida lo evaluado hasta ahora con este cliente: estado general, dónde enfocar la propuesta, un brief listo para copiar y, si aplicaste más de una modalidad, los patrones que se repiten entre fuentes.</p>
  </div>`;

  html += `<div class="results-title"><h2>Estado general</h2></div>`;
  html += snapshotRow();

  html += tipoDistributionBlock(weakAreas);

  const brief = buildBrief(weakAreas);
  if(brief){
    html += `<div class="results-title" style="margin-top:34px;"><h2>Brief para la propuesta</h2></div>
    <p style="color:var(--gris);font-size:13px;margin-top:4px;">Texto listo para copiar y pegar en tu propuesta o CRM.</p>
    <div class="brief-box">
      <textarea class="brief-textarea" id="brief-textarea" readonly>${esc(brief)}</textarea>
      <button class="mini-btn" id="btn-copy-brief" type="button">📋 Copiar texto</button>
    </div>`;
  }

  html += `<div class="results-title" style="margin-top:34px;"><h2>Cruce de patrones entre modalidades</h2></div>`;
  if(sectionsUsed < 2){
    html += `<p style="color:var(--gris);font-size:13px;margin-top:4px;">Esto se activa automáticamente cuando aplicas 2 o más modalidades con este cliente.</p>`;
  }
  const { confirmed, single } = buildCorrelation();
  if(confirmed.length>0){
    html += `<div class="weak-wrap"><h3 style="font-size:15px;font-weight:600;">🔴 Patrones confirmados en más de una fuente</h3>`;
    confirmed.forEach(t=> html += themeCard(t, true));
    html += `</div>`;
  }
  if(single.length>0){
    html += `<div class="weak-wrap"><h3 style="font-size:15px;font-weight:600;">🟠 Señales individuales</h3>`;
    single.forEach(t=> html += themeCard(t, false));
    html += `</div>`;
  }
  if(confirmed.length===0 && single.length===0){
    html += `<p style="color:var(--gris);font-size:13.5px;margin-top:10px;">Aún no hay señales para cruzar.</p>`;
  }

  html += `<div class="results-title" style="margin-top:34px;"><h2>KPIs a monitorear</h2></div>`;
  if(state.kpis.length===0){
    html += `<p style="color:var(--gris);font-size:13.5px;margin-top:8px;">Aún no se ha marcado ningún KPI. Puedes hacerlo desde las conclusiones de cada sección.</p>`;
  } else {
    html += `<div class="kpi-summary-list">`;
    state.kpis.forEach(k=>{
      html += `<div class="kpi-summary-row">
        <span class="kpi-summary-tag">Sección ${k.section}</span>
        ${kpiEditRow(k)}
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="export-bar"><button class="btn-export" id="export-4">⭳ Descargar PDF — Panel 360</button></div>`;
  return html;
}

/* ============== BIND EVENTS ============== */
function bindSection1(root){
  root.querySelectorAll('[data-s1]').forEach(b=>{
    b.onclick = ()=>{
      const ci = +b.dataset.ci, ii = +b.dataset.ii, raw = b.dataset.val;
      state.s1[ci].items[ii] = raw==="na" ? "na" : (raw==="true");
      renderAll();
    };
  });
  root.querySelectorAll('[data-s1-lock]').forEach(b=>{
    b.onclick = ()=>{
      const ci = +b.dataset.ci;
      state.s1[ci].locked = !state.s1[ci].locked;
      renderAll();
    };
  });
}
function bindSection2(root){
  root.querySelectorAll('[data-s2]').forEach(b=>{
    b.onclick = ()=>{
      const ci = +b.dataset.ci, ii = +b.dataset.ii, val = +b.dataset.val;
      state.s2[ci].items[ii] = val;
      renderAll();
    };
  });
  root.querySelectorAll('[data-s2-lock]').forEach(b=>{
    b.onclick = ()=>{
      const ci = +b.dataset.ci;
      state.s2[ci].locked = !state.s2[ci].locked;
      renderAll();
    };
  });
}
function bindSection3(root){
  root.querySelectorAll('[data-s3-toggle]').forEach(cb=>{
    cb.onchange = ()=>{ state.s3[+cb.dataset.ii].enabled = cb.checked; renderAll(); };
  });
  root.querySelectorAll('[data-s3-name]').forEach(inp=>{
    inp.oninput = ()=>{ state.s3[+inp.dataset.ii].name = inp.value; persistCase(); };
    inp.onblur = ()=> renderAll();
  });
  root.querySelectorAll('[data-s3-slider]').forEach(sl=>{
    sl.oninput = ()=>{
      const ii = +sl.dataset.ii;
      state.s3[ii].score = +sl.value;
      state.s3[ii].answered = true;
      const badge = sl.parentElement.querySelector('.s3-badge');
      badge.textContent = sl.value;
      sl.parentElement.classList.remove('unanswered');
      const hint = sl.parentElement.querySelector('.s3-hint');
      if(hint) hint.remove();
      persistCase();
    };
    sl.onchange = ()=> renderAll();
  });
}
function bindKpiActions(root){
  root.querySelectorAll('[data-kpi-add]').forEach(b=>{
    b.onclick = ()=>{
      const key = b.dataset.key, section = +b.dataset.section, label = b.dataset.label, sugidx = +b.dataset.sugidx;
      const id = 'kpi_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      state.kpis.push({ id, section, areaKey:key, label, value:"", meta:"", tiempo:"", suggestionIdx:sugidx });
      persistCase();
      renderAll();
    };
  });
  root.querySelectorAll('[data-kpi-custom-add]').forEach(b=>{
    b.onclick = ()=>{
      const key = b.dataset.key, section = +b.dataset.section;
      const id = 'kpi_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      state.kpis.push({ id, section, areaKey:key, label:"", value:"", meta:"", tiempo:"", suggestionIdx:null });
      persistCase();
      renderAll();
    };
  });
  root.querySelectorAll('[data-kpi-remove]').forEach(b=>{
    b.onclick = ()=>{
      state.kpis = state.kpis.filter(k=>k.id!==b.dataset.id);
      persistCase();
      renderAll();
    };
  });
  root.querySelectorAll('[data-kpi-label]').forEach(inp=>{
    inp.oninput = ()=>{
      const k = state.kpis.find(x=>x.id===inp.dataset.id);
      if(k){ k.label = inp.value; syncFieldAcrossDom(`[data-kpi-label][data-id="${inp.dataset.id}"]`, inp.value, inp); persistCase(); }
    };
  });
  root.querySelectorAll('[data-kpi-value]').forEach(inp=>{
    inp.oninput = ()=>{
      const k = state.kpis.find(x=>x.id===inp.dataset.id);
      if(k){ k.value = inp.value; syncFieldAcrossDom(`[data-kpi-value][data-id="${inp.dataset.id}"]`, inp.value, inp); persistCase(); }
    };
  });
  root.querySelectorAll('[data-kpi-meta]').forEach(inp=>{
    inp.oninput = ()=>{
      const k = state.kpis.find(x=>x.id===inp.dataset.id);
      if(k){ k.meta = inp.value; syncFieldAcrossDom(`[data-kpi-meta][data-id="${inp.dataset.id}"]`, inp.value, inp); persistCase(); }
    };
  });
  root.querySelectorAll('[data-kpi-tiempo]').forEach(inp=>{
    inp.oninput = ()=>{
      const k = state.kpis.find(x=>x.id===inp.dataset.id);
      if(k){ k.tiempo = inp.value; syncFieldAcrossDom(`[data-kpi-tiempo][data-id="${inp.dataset.id}"]`, inp.value, inp); persistCase(); }
    };
  });
}

function bindSection4(root){
  const copyBtn = root.querySelector('#btn-copy-brief');
  if(!copyBtn) return;
  copyBtn.onclick = ()=>{
    const ta = document.getElementById('brief-textarea');
    ta.select();
    ta.setSelectionRange(0, 999999);
    const done = ()=>{ copyBtn.textContent = '✓ Copiado'; setTimeout(()=>{ copyBtn.textContent = '📋 Copiar texto'; }, 1800); };
    const fallback = ()=>{
      try{ document.execCommand('copy'); done(); }
      catch(e){ alert('No se pudo copiar automáticamente. El texto ya está seleccionado — usa Ctrl+C / Cmd+C.'); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done).catch(fallback);
    } else {
      fallback();
    }
  };
}

/* ============== EXPORT PDF ============== */
async function exportPdf(sectionKey, titleForFile){
  const node = document.getElementById('capture-' + sectionKey);
  node.classList.add('capturing');
  node.querySelectorAll('input[type=text], input[type=date]').forEach(inp=>{ inp.setAttribute('value', inp.value); });
  node.querySelectorAll('textarea').forEach(ta=>{ ta.textContent = ta.value; });
  const btn = document.getElementById('export-' + sectionKey.slice(-1));
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = "Generando PDF…"; }
  await new Promise(r=>setTimeout(r,50));
  try{
    const canvas = await html2canvas(node, { scale:2, backgroundColor:"#F7F7F5", useCORS:true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = 210, pageH = 297;
    const imgW = pageW - 20;
    const imgH = canvas.height * imgW / canvas.width;
    let heightLeft = imgH;
    let position = 10;
    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 10, position, imgW, imgH);
    heightLeft -= (pageH - 20);
    while(heightLeft > 0){
      position = heightLeft - imgH + 10;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 10, position, imgW, imgH);
      heightLeft -= (pageH - 20);
    }
    const filename = `${titleForFile} - ${state.header.empresa||'diagnostico'}.pdf`;
    try{
      pdf.save(filename);
    } catch(saveErr){
      const blobUrl = pdf.output('bloburl');
      window.open(blobUrl, '_blank');
    }
  } catch(err){
    console.error(err);
    alert("No se pudo generar la descarga automática del PDF en este entorno de vista previa.\n\nEsto suele pasar porque el panel de preview bloquea descargas.\n\nSolución: descarga este archivo HTML y ábrelo directamente en tu navegador (Chrome/Edge) — ahí la exportación a PDF funciona sin restricciones.");
  } finally {
    node.classList.remove('capturing');
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

/* ============== MASTER RENDER ============== */
const EXPORT_TITLES = {
  1:"Diagnóstico del departamento comercial",
  2:"Diagnóstico de la gestión comercial",
  3:"Diagnóstico de competencias comerciales",
  4:"Panel 360 - Conclusiones consolidadas"
};

function renderAll(){
  if(appView==='case' && state) persistCase();
  renderNav();
  const wrap = document.getElementById('sections-wrap');

  if(appView==='landing'){
    wrap.innerHTML = renderLandingView();
    bindLanding(wrap);
    return;
  }

  wrap.innerHTML = `
    <div class="section-block ${state.currentTab===0?'active':''}"><div id="capture-section0">${renderIntake()}</div></div>
    <div class="section-block ${state.currentTab===1?'active':''}"><div id="capture-section1">${renderSection1()}</div></div>
    <div class="section-block ${state.currentTab===2?'active':''}"><div id="capture-section2">${renderSection2()}</div></div>
    <div class="section-block ${state.currentTab===3?'active':''}"><div id="capture-section3">${renderSection3()}</div></div>
    <div class="section-block ${state.currentTab===4?'active':''}"><div id="capture-section4">${renderSection4()}</div></div>
  `;
  bindFicha(wrap);
  bindIntake(wrap);
  bindSection1(wrap);
  bindSection2(wrap);
  bindSection3(wrap);
  bindKpiActions(wrap);
  bindSection4(wrap);
  ['1','2','3','4'].forEach(n=>{
    const btn = document.getElementById('export-'+n);
    if(btn) btn.onclick = ()=>exportPdf('section'+n, EXPORT_TITLES[n]);
  });
}

renderAll();
